services:
  backend-component:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${NAME_OF_APPLICATION:-opcp-proxmox-experience}-backend-component-${USER_ID:-0}-${HTTP_PORT:-5000}
    ports:
      - "${HTTP_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - USER_ID=${USER_ID:-1}
      - USER_NAME=${USER_NAME:-User}
      - USER_EMAIL=${USER_EMAIL:-user@example.com}
      - DESCRIPTION=${DESCRIPTION:-Proxmox GPU Passthrough Automation}
    volumes:
      - app_data:/app/data
      - ./skillhub:/app/templates:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend-component:
    image: nginx:alpine
    container_name: ${NAME_OF_APPLICATION:-opcp-proxmox-experience}-nginx-${USER_ID:-0}-${HTTPS_PORT:-5001}
    ports:
      - "${HTTPS_PORT:-5001}:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./skillhub:/var/www/html:rw
    depends_on:
      - backend-component
    restart: unless-stopped
    environment:
      - HTTPS_PORT=${HTTPS_PORT:-5001}

volumes:
  app_data:
    driver: local
